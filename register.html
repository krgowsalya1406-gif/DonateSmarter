<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DonateSmart - Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url("https://plus.unsplash.com/premium_photo-1661962927450-d5f7c9267ca2?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDZ8fHxlbnwwfHx8fHw%3D")
    center/cover no-repeat;
}


/* Register Box */

.register-box{

    width:400px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}


.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#19a463;
    margin-bottom:20px;
}


h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}


.input-box{
    margin-bottom:15px;
}


.input-box input,
.input-box select{

    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;

}


button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:25px;
    background:#19a463;
    color:white;
    font-size:18px;
    cursor:pointer;

}


button:hover{

    background:#117845;

}


.login-link{

    text-align:center;
    margin-top:20px;

}


.login-link a{

    color:#19a463;
    text-decoration:none;
    font-weight:bold;

}

.btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#19a463;
    color:white;
    padding:14px;
    border-radius:25px;
    font-size:18px;
    font-weight:bold;
}

.btn:hover{
    background:#117845;
}


</style>

</head>


<body>


<div class="register-box">

<div class="logo">
❤ DonateSmart
</div>


<h2>Create Account</h2>


<form>


<div class="input-box">
<input type="text" placeholder="Full Name">
</div>


<div class="input-box">
<input type="email" placeholder="Email Address">
</div>


<div class="input-box">
<input type="phone" placeholder="Phone Number">
</div>


<div class="input-box">
<input type="password" placeholder="Password">
</div>





<a href="dashboard.html" class="btn">Register</a>

</button>

</form>



<div class="login-link">

Already have an account?
<a href="login.html">Login</a>

</div>


</div>


</body>
</html>
