<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DonateSmart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
    url("https://plus.unsplash.com/premium_photo-1661964155049-f8a24a60be74?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fGRvbmF0ZXxlbnwwfHwwfHx8MA%3D%3D")
    center/cover no-repeat;
    color:white;
}


/* Top Logo */
.logo{
    position:absolute;
    top:30px;
    left:50px;
    display:flex;
    align-items:center;
    font-size:30px;
    font-weight:bold;
}

.logo-icon{
    width:45px;
    height:45px;
    background:white;
    color:#19a463;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:12px;
    font-size:25px;
}


/* Main Content */
.content{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    flex-direction:column;
}


h1{
    font-size:60px;
    margin-bottom:20px;
}

h1 span{
    color:#6cff9b;
}


p{
    font-size:24px;
    max-width:650px;
    line-height:1.5;
}


button{
    margin-top:35px;
    padding:16px 45px;
    border:none;
    border-radius:30px;
    background:#19a463;
    color:white;
    font-size:18px;
    cursor:pointer;
}


button:hover{
    background:#117845;
}

.btn{
    margin-top:35px;
    padding:16px 45px;
    background:#19a463;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    display:inline-block;
    transition:0.3s;
}

.btn:hover{
    background:#117845;
    transform:scale(1.05);
}

</style>
</head>

<body>




<div class="content">

<h1>
Donate <span>Smarter</span>
</h1>

<p>
Small acts of kindness can create a big impact.
Join us in making the world a better place through smart donations.
</p>

<a href="register.html" class="btn">
    Get Started
</a>

</div>

</body>
</html>
